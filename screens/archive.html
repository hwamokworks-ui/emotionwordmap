const STORE_KEY = 'ewm_store_v1';
function loadStore(){
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s) return s; } catch(e){}
  return { discovered:[], saved:[], notes:[], disclog:[], savelog:[] };
}
let store = loadStore();
function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }

let statTab = 'disc'; // disc | saved | notes
let chartMode = 'day'; // day | month | year
let chartPick = null;

function renderStatTabs(){
  const tabs = [
    { id:'disc',  label:'발견한 감정',  value: store.discovered.length, suffix:'개' },
    { id:'saved', label:'저장한 단어',  value: store.saved.length, suffix:'개' },
    { id:'notes', label:'마음 기록',    value: store.notes.length, suffix:'개' },
  ];
  document.getElementById('statTabs').innerHTML = tabs.map(t => `
    <button onclick="setTab('${t.id}')" class="stat-tab ${statTab===t.id?'active':''}">
      <span class="block mb-1 text-[10.5px] label-eyebrow text-taupe">${t.label}</span>
      <span class="font-serif-kr text-[26px]">${t.value}<span class="text-[13px] text-dim">${t.suffix}</span></span>
    </button>`).join('');
}
function setTab(id){ statTab = id; chartPick = null; renderAll(); }
function setChartMode(m){ chartMode = m; chartPick = null; renderAll(); }

function renderSavedChips(){
  const box = document.getElementById('savedChips');
  if (!store.saved.length){ box.innerHTML = '<p class="text-dim text-[13px]">아직 저장한 단어가 없습니다. 지도에서 마음에 닿는 단어를 저장해 보세요.</p>'; return; }
  box.innerHTML = store.saved.map(id => {
    const w = WORDS[id]; if (!w) return '';
    const r = REGION_BY_ID[w.r];
    return `<a href="map.html?w=${id}" class="chip text-[14px]" style="background:${r.color}18; border:1px solid ${r.color}55; color:${r.color};">${w.n}</a>`;
  }).join('');
}

function bucketKey(ts, mode){
  const d = new Date(ts);
  if (mode === 'day') return d.toISOString().slice(0,10);
  if (mode === 'month') return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}`;
  return String(d.getFullYear());
}
function bucketLabel(key, mode){
  if (mode === 'day'){ const [,m,dd] = key.split('-'); return `${+m}/${+dd}`; }
  if (mode === 'month'){ const [y,m] = key.split('.'); return `${y.slice(2)}년 ${+m}월`; }
  return `${key}년`;
}
function recentBuckets(mode){
  const now = new Date(); const keys = [];
  if (mode === 'day'){ for (let i=13;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); keys.push(bucketKey(d.getTime(),'day')); } }
  else if (mode === 'month'){ for (let i=11;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); keys.push(bucketKey(d.getTime(),'month')); } }
  else { for (let i=2;i>=0;i--){ keys.push(String(now.getFullYear()-i)); } }
  return keys;
}

function renderChart(){
  const box = document.getElementById('chartSection');
  const notesBox = document.getElementById('notesSection');
  if (statTab === 'notes'){
    box.innerHTML = '';
    notesBox.classList.remove('hidden');
    renderNotes();
    return;
  }
  notesBox.classList.add('hidden');
  const log = statTab === 'saved' ? store.savelog : store.disclog;
  const keys = recentBuckets(chartMode);
  const counts = keys.map(k => log.filter(e => bucketKey(e.at, chartMode) === k).length);
  const max = Math.max(1, ...counts);
  const total = log.length;

  const bars = keys.map((k,i) => `
    <button onclick="chartPick = chartPick==='${k}' ? null : '${k}'; renderAll();" class="flex-1 flex flex-col items-center justify-end gap-1.5 h-full" style="cursor:${counts[i]?'pointer':'default'};">
      <span class="text-[10px] text-taupe">${counts[i]||''}</span>
      <div class="w-full rounded-sm" style="max-width:34px; height:${Math.max(3,counts[i]/max*100)}%; background:${chartPick===k?'var(--accent-amber)':'var(--border-hairline-strong)'};"></div>
    </button>`).join('');
  const axis = keys.map(k => `<div class="flex-1 text-center text-[10px] text-dim">${bucketLabel(k,chartMode)}</div>`).join('');

  const nonEmpty = keys.map((k,i)=>({k,count:counts[i]})).filter(b=>b.count>0).reverse();
  const shown = chartPick ? nonEmpty.filter(b=>b.k===chartPick) : nonEmpty;
  const groupsHtml = shown.length ? shown.map(b => {
    const ids = log.filter(e => bucketKey(e.at,chartMode)===b.k).map(e=>e.id).reverse();
    return `<div class="grid gap-3 items-baseline" style="grid-template-columns:120px minmax(0,1fr);">
      <div class="flex items-baseline gap-1.5"><span class="text-[12.5px]">${bucketLabel(b.k,chartMode)}</span><span class="text-[11px] text-dim">${b.count}개</span></div>
      <div class="flex flex-wrap gap-1.5">${ids.map(id=>{const w=WORDS[id]; return w?`<a href="map.html?w=${id}" class="chip text-[13px]" style="border:1px solid ${REGION_BY_ID[w.r].color}66; color:${REGION_BY_ID[w.r].color};">${w.n}</a>`:''}).join('')}</div>
    </div>`;
  }).join('') : `<p class="text-dim text-[13px]">이 기간에 발견한 단어가 없습니다.</p>`;

  box.innerHTML = `
    <div class="flex items-center justify-between gap-4 mb-3">
      <p class="text-xs text-taupe label-eyebrow">${statTab==='saved'?'저장 추이':'발견 추이'} · 누적 ${total}개</p>
      <div class="flex gap-1.5">
        ${['day','month','year'].map(m => `<button onclick="setChartMode('${m}')" class="px-3 py-1.5 rounded-full text-[11.5px]" style="border:1px solid var(--border-hairline-strong); background:${chartMode===m?'var(--accent-amber-dim)':'transparent'}; color:${chartMode===m?'var(--accent-amber-strong)':'var(--text-secondary)'};">${m==='day'?'일별':m==='month'?'월별':'연도별'}</button>`).join('')}
      </div>
    </div>
    <div class="paper-card p-5">
      <div class="flex items-end gap-2" style="height:150px;">${bars}</div>
      <div class="flex gap-2 mt-2 pt-2" style="border-top:1px solid var(--border-hairline);">${axis}</div>
      <div class="flex flex-col gap-3 mt-5 pt-4" style="border-top:1px solid var(--border-hairline);">
        ${groupsHtml}
        ${chartPick ? `<button onclick="chartPick=null; renderAll();" class="self-start mt-1 text-[11.5px] text-taupe" style="padding:5px 11px; border:1px dashed var(--border-hairline-strong); border-radius:999px;">전체 기간 보기</button>` : ''}
      </div>
    </div>`;
}

function renderNotes(){
  const box = document.getElementById('notesList');
  if (!store.notes.length){ box.innerHTML = '<p class="text-dim text-[13px]">아직 남긴 기록이 없습니다. 지도의 감정 상세 패널에서 그 순간을 적어보세요.</p>'; return; }
  box.innerHTML = store.notes.slice().reverse().map(n => {
    const w = WORDS[n.id]; const r = w ? REGION_BY_ID[w.r] : null;
    return `<div class="index-card p-4" style="border-left:3px solid ${r?r.color:'var(--border-hairline-strong)'};">
      <div class="flex items-center justify-between gap-2 mb-1.5">
        <a href="map.html?w=${n.id}" class="font-serif-kr text-[15px]" style="color:${r?r.color:'inherit'}">${w?w.n:n.id}</a>
        <span class="text-[11px] text-dim">${new Date(n.at).toLocaleDateString('ko-KR')}</span>
      </div>
      <p class="text-[13px] text-parchment/90 leading-relaxed">${n.text}</p>
    </div>`;
  }).join('');
}

function renderRegionCompletion(){
  document.getElementById('regionCompletion').innerHTML = REGIONS.map(r => {
    const words = WORD_ROWS.filter(w => w[2] === r.id);
    const found = words.filter(w => store.discovered.includes(w[0]));
    const pct = Math.round(found.length / words.length * 100);
    return `<div class="paper-card p-4">
      <div class="flex items-center justify-between mb-2">
        <span class="font-serif-kr text-[16px]">${r.name}</span>
        <span class="text-[11.5px] text-dim">${found.length}/${words.length}</span>
      </div>
      <div class="region-progress"><div style="width:${pct}%; background:${r.color};"></div></div>
      <p class="text-[11.5px] text-taupe mt-2 leading-relaxed">${found.length ? found.map(w=>w[1]).join(', ') : '아직 발견한 단어가 없어요'}</p>
    </div>`;
  }).join('');
}

function renderBadges(){
  const d = store.discovered.length;
  const s = store.saved.length;
  const n = store.notes.length;
  const p = EDGE_PAIRS.filter(([a,b]) => store.discovered.includes(a) && store.discovered.includes(b)).length;
  const BADGES = [
    { name:'첫 발견', glyph:'一', desc:'첫 번째 감정 발견', ok: d>=1 },
    { name:'감정 탐험가', glyph:'地', desc:'감정 단어 12개 발견', ok: d>=12 },
    { name:'감정 탐정', glyph:'尋', desc:'이웃 감정 8쌍 탐색', ok: p>=8 },
    { name:'어휘 수집가', glyph:'集', desc:'감정 단어 10개 저장', ok: s>=10 },
    { name:'마음의 기록자', glyph:'記', desc:'감정 기록 3회', ok: n>=3 },
    { name:'감정 도서관 사서', glyph:'書', desc:'모든 감정 단어 발견', ok: d>=WORD_ROWS.length },
  ];
  document.getElementById('badgesGrid').innerHTML = BADGES.map(b => `
    <div class="paper-card p-4 flex items-center gap-3" style="opacity:${b.ok?1:0.45};">
      <div class="badge-seal">
        <svg width="42" height="42" viewBox="0 0 42 42" style="position:absolute; inset:0;">
          <circle cx="21" cy="21" r="19" fill="none" stroke="${b.ok?'var(--accent-amber)':'var(--text-tertiary)'}" stroke-width="1" stroke-dasharray="3 4"/>
          <circle cx="21" cy="21" r="14.5" fill="${b.ok?'var(--accent-amber-dim)':'var(--bg-elevated2)'}" stroke="${b.ok?'var(--accent-amber)':'var(--text-tertiary)'}" stroke-width="1.2"/>
        </svg>
        <span class="relative font-serif-kr text-[15px]" style="color:${b.ok?'var(--accent-amber-strong)':'var(--text-tertiary)'};">${b.glyph}</span>
      </div>
      <div>
        <p class="font-serif-kr text-[14.5px]">${b.name}</p>
        <p class="text-[11px] text-taupe leading-snug mt-0.5">${b.desc}</p>
      </div>
    </div>`).join('');
}

function resetAll(){
  if (!confirm('지금까지의 발견·저장·기록을 모두 초기화할까요?')) return;
  store = { discovered:[], saved:[], notes:[], disclog:[], savelog:[] };
  persist();
  renderAll();
}

function renderAll(){
  store = loadStore();
  renderStatTabs();
  renderSavedChips();
  renderChart();
  renderRegionCompletion();
  renderBadges();
}
renderAll();
</script>
</body>
</html>
