const REGION_BY_ID = Object.fromEntries(REGIONS.map(r => [r.id, r]));
const WORDS = {};
WORD_ROWS.forEach(row => {
  const [id,w,n,r,i,pos,prop,def,say,scene] = row;
  WORDS[id] = { id,w,n,r,i,pos,prop,def,say,scene };
});
const ADJ = {};
EDGE_PAIRS.forEach(([a,b]) => {
  (ADJ[a] = ADJ[a]||[]).push(b);
  (ADJ[b] = ADJ[b]||[]).push(a);
});
const WORDS_BY_REGION = {};
Object.values(WORDS).forEach(w => (WORDS_BY_REGION[w.r] = WORDS_BY_REGION[w.r]||[]).push(w));

// 골든 앵글 스파이럴로 영역 안에 단어 배치
Object.keys(WORDS_BY_REGION).forEach(rid => {
  const region = REGION_BY_ID[rid];
  const words = WORDS_BY_REGION[rid];
  const n = words.length;
  words.forEach((w, i) => {
    const t = Math.sqrt((i + 0.55) / n);
    const angle = i * 2.39996323;
    w._x = region.cx + region.rx * t * Math.cos(angle) * 0.82;
    w._y = region.cy + region.ry * t * Math.sin(angle) * 0.82;
  });
});

const STORE_KEY = 'ewm_store_v1';
function loadStore(){
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s) return s; } catch(e){}
  return { discovered:['meokmeok','seoun','uljeok'], saved:[], notes:[], disclog:[{id:'meokmeok',at:Date.now()},{id:'seoun',at:Date.now()},{id:'uljeok',at:Date.now()}], savelog:[] };
}
let store = loadStore();
function persist(){ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
function isDiscovered(id){ return store.discovered.includes(id); }
function tierOf(id){
  if (isDiscovered(id)) return 2;
  const nbs = ADJ[id] || [];
  if (nbs.some(isDiscovered)) return 1;
  return 0;
}
function discover(id){
  if (isDiscovered(id)) return;
  store.discovered.push(id);
  store.disclog.push({ id, at: Date.now() });

}

/* ══════════════ 관계 · 경로 ══════════════ */
// 전체 그래프 기준 BFS 홉 거리 (발견 여부와 무관 — "얼마나 가까운 감정인가"를 보여주기 위한 값)
function hopDistancesFrom(id){
  const dist = { [id]: 0 };
  const queue = [id];
  while (queue.length){
    const cur = queue.shift();
    for (const nb of (ADJ[cur]||[])){
      if (dist[nb] === undefined){ dist[nb] = dist[cur] + 1; queue.push(nb); }
    }
  }
  return dist;
}
function hopToPercent(h){ return h===1?92 : h===2?74 : h===3?56 : h===4?40 : 25; }

// 가까운 감정 — 그래프상 실제로 가까운 순서(1촌 → 2촌)로, 거리(%)를 함께 보여준다
function nearOf(id){
  const dist = hopDistancesFrom(id);
  return Object.entries(dist)
    .filter(([nid,h]) => nid !== id && h <= 3)
    .sort((a,b) => a[1]-b[1])
    .slice(0,4)
    .map(([nid,h]) => ({ ...WORDS[nid], pct: hopToPercent(h) }));
}
// 반의어 — 다른 영역 중 강도 차이가 가장 큰 단어 하나(결정적 규칙, id로 동점 처리)
function antonymOf(id){
  const w = WORDS[id];
  let best = null, bestScore = -1;
  for (const cand of Object.values(WORDS)){
    if (cand.r === w.r) continue;
    const score = Math.abs(cand.i - w.i);
    if (score > bestScore || (score === bestScore && best && cand.id < best.id)){ bestScore = score; best = cand; }
  }
  return best;
}
// 조금 다른 감정 — 반의어를 제외한, 다른 영역 + 강도차 있는 보조 후보 2개
function farOf(id, excludeId){
  const w = WORDS[id];
  const out = [];
  for (const cand of Object.values(WORDS)){
    if (out.length >= 2) break;
    if (cand.id === id || cand.id === excludeId) continue;
    if (cand.r === w.r) continue;
    if (Math.abs(cand.i - w.i) >= 1) out.push(cand);
  }
  return out;
}
function breadcrumb(id){
  const w = WORDS[id];
  const root = REGION_BY_ID[w.r].root;
  if (id === root) return [id];
  const allowed = new Set(store.discovered); allowed.add(id); allowed.add(root);
  const queue = [[root]]; const visited = new Set([root]);
  while (queue.length){
    const path = queue.shift();
    const last = path[path.length - 1];
    if (last === id) return path;
    for (const nb of (ADJ[last]||[])){
      if (!allowed.has(nb) || visited.has(nb)) continue;
      visited.add(nb); queue.push([...path, nb]);
    }
  }
  return [id];
}

/* ══════════════ 팬 · 줌 ══════════════ */
const wrap = document.getElementById('mapWrap');
const canvas = document.getElementById('mapCanvas');
let zoom = 0.58, panX = 0, panY = 0, dragging = false, dragStart = {x:0,y:0}, panStart = {x:0,y:0};
function applyTransform(animate){
  canvas.style.transition = animate ? 'transform .4s ease' : 'none';
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
}
const PANEL_WIDTH = 422; // 우측 상세 패널(400px + 여백 22px)이 가리는 폭 — 열려 있을 땐 그만큼 왼쪽으로 당겨서 보이는 영역 기준으로 가운데를 맞춘다
function centerOn(cx, cy, avoidPanel){
  const rect = wrap.getBoundingClientRect();
  const usableWidth = avoidPanel ? Math.max(200, rect.width - PANEL_WIDTH) : rect.width;
  panX = usableWidth/2 - cx*zoom;
  panY = rect.height/2 - cy*zoom;
  applyTransform(true);
}
function zoomBy(f){ zoom = Math.min(1.3, Math.max(0.16, zoom*f)); applyTransform(true); }
function recenter(){ focusId ? centerOn(WORDS[focusId]._x, WORDS[focusId]._y, true) : centerOn(MAPW/2, MAPH/2); }
wrap.addEventListener('mousedown', e => { dragging=true; wrap.classList.add('dragging'); dragStart={x:e.clientX,y:e.clientY}; panStart={x:panX,y:panY}; });
window.addEventListener('mousemove', e => { if(!dragging) return; panX = panStart.x + (e.clientX-dragStart.x); panY = panStart.y + (e.clientY-dragStart.y); applyTransform(false); });
window.addEventListener('mouseup', () => { dragging=false; wrap.classList.remove('dragging'); });
wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = wrap.getBoundingClientRect();
  const mouseX = e.clientX - rect.left, mouseY = e.clientY - rect.top;
  const canvasX = (mouseX - panX) / zoom, canvasY = (mouseY - panY) / zoom;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12; // 스크롤 업 → 확대, 스크롤 다운 → 축소
  zoom = Math.min(1.3, Math.max(0.16, zoom * factor));
  panX = mouseX - canvasX * zoom;
  panY = mouseY - canvasY * zoom;
  applyTransform(false);
}, { passive: false });
